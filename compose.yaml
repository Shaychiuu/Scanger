# Scanger's own PostgreSQL. Independent of any other project's containers:
# it has its own Compose project name, container name, volume and host port.
name: scanger

services:
  db:
    image: postgres:16-alpine
    container_name: scanger-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PW:?Set DB_PW in .env}
    ports:
      # Loopback only; 5432 is left to other projects.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - scanger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scanger_pgdata:
